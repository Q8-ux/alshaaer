<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174c3b" />
    <title>أنت الشاعر</title>
    <style>
      @font-face { font-family: "AL Mohanad"; src: url("./fonts/AL-Mohanad.ttf") format("truetype"); font-weight: 400 600; font-display: swap; }
      @font-face { font-family: "AL Mohanad"; src: url("./fonts/AL-Mohanad-Bold.ttf") format("truetype"); font-weight: 700 800; font-display: swap; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #143d31; background: radial-gradient(circle at top, #f7f0e4, #e6eee7); font-family: "AL Mohanad", Tahoma, sans-serif; font-size: 18px; }
      main { width: min(100%, 620px); padding: 44px 28px; text-align: center; border: 1px solid #d7dfd6; border-radius: 28px; background: rgba(255,255,255,.87); box-shadow: 0 22px 70px rgba(20,61,49,.16); }
      .mark { display: inline-grid; place-items: center; width: 68px; height: 68px; margin-bottom: 18px; border-radius: 22px; color: #fff; background: #174c3b; font-size: 34px; }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); }
      p { margin: 16px auto 26px; max-width: 480px; color: #52665e; font-size: 16px; line-height: 2; }
      a { display: inline-block; padding: 15px 27px; border-radius: 14px; color: #fff; background: #174c3b; text-decoration: none; font-weight: 700; box-shadow: 0 12px 26px rgba(23,76,59,.22); }
      small { display: block; margin-top: 24px; color: #7d8d85; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">✒</div>
      <h1>أنت الشاعر</h1>
      <p>حوّل قصتك المكتوبة أو تسجيلك الصوتي إلى أبيات شعرية مخصّصة لك.</p>
      <a href="https://github.com/Q8-ux/alshaaer">فتح مستودع المشروع</a>
      <small>المصدر والتحديثات الرسمية محفوظة على GitHub.</small>
    </main>
  </body>
</html>
